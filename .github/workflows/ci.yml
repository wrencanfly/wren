name: CI
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # Virtual checkouts (wren mount, --features vfs) use FUSE on Linux and
      # the system's NFS client on macOS.
      - if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y fuse3
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --features wren-vcs/vfs -- -D warnings
      # Includes differential tests against git and the end-to-end suite.
      # Postgres tests start a throwaway server from the runner's binaries,
      # and the mount test needs FUSE; on Linux neither may be skipped.
      - run: cargo test --release --features wren-vcs/vfs
        env:
          WREN_REQUIRE_PG: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}
          WREN_REQUIRE_VFS: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

  # Nightly: the differential fuzz suite over many seeds (git is the oracle).
  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fuzz with 8 seeds derived from the run number
        run: |
          seeds=$(for i in $(seq 1 8); do echo -n "$(( ${{ github.run_number }} * 100 + i )),"; done)
          WREN_FUZZ_SEEDS=${seeds%,} cargo test --release -p wren-vcs-core --test differential -- --nocapture
      - name: Merges and rebases against git merge-tree, 50 fresh seeds
        run: |
          WREN_MERGE_SEEDS=50 WREN_MERGE_SEED_BASE=$(( ${{ github.run_number }} * 1000 )) \
            cargo test --release -p wren-vcs-core --test merge merges_agree -- --nocapture
      - name: Simulate the tiers under faults, 1000 fresh seeds
        run: |
          WREN_SIM_SEEDS=1000 WREN_SIM_SEED_BASE=$(( ${{ github.run_number }} * 1000 )) \
            cargo test --release -p wren-vcs --test sim tiers_under_faults -- --nocapture
