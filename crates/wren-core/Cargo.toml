[package]
name = "wren-vcs-core"
version = "0.1.0"
edition.workspace = true

[lib]
name = "wren_core"

[dependencies]
anyhow = "1.0.104"
flate2 = "1.1.10"
hex = "0.4.3"
imara-diff = { version = "0.2.0", default-features = false }
memmap2 = "0.9.5"
postgres = "0.19.10"
rayon = "1.12.0"
regex = "1.11"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
similar = "3.2.0"
tempfile = "3.27.0"
zstd = "0.13.3"
